# BlueZ daemon config, overridden by universal_proxy.
#
# The only deviation from bluetoothd's built-in defaults is the LE
# active-discovery scan duty cycle. BlueZ's default discovery scan is
# aggressive (~50% duty), which fire-hoses BLE advertisements: every received
# advert becomes an org.bluez PropertiesChanged signal that the rebus client
# must D-Bus-decode, dominating BEAM CPU. Dropping to a ~10% duty cycle (30ms
# window every 300ms) cuts the advert rate ~5x with no practical loss for
# passive sensor scanning — this is the same window/interval the previous
# blue_heron stack used on this hardware (le_scan_window 0x0030 /
# le_scan_interval 0x01E0).
#
# Units are raw BLE scan units of 0.625ms (Bluetooth Core Spec): 48 * 0.625 =
# 30ms window, 480 * 0.625 = 300ms interval. All other settings fall back to
# bluetoothd defaults.
[LE]
ScanIntervalDiscovery = 480
ScanWindowDiscovery = 48
