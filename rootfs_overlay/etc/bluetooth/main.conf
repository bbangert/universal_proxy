# BlueZ daemon config, overridden by universal_proxy.
#
# See the [General] and [LE] sections below.

[General]
# Turn on the kernel's ISO socket support, which BlueZ needs for LE Audio
# (the BAP profile). The kernel builds the code in (CONFIG_BT_LE=y) but keeps
# it behind an "experimental" MGMT switch that bluetoothd only flips when the
# feature is listed here; its -E flag covers BlueZ's own experimental
# interfaces, not the kernel's. Without this bluetoothd logs "BAP requires
# ISO Socket which is not enabled" at startup. ISO channels also need a
# Bluetooth 5.2+ controller, so this has no effect on older radios such as
# the Pi 3's onboard chip. Only this one feature is enabled, not all of them.
KernelExperimental = 6fbaf188-05e0-496a-9885-d6ddfdb4e03e

# In passive mode (the default — AdvertisementMonitor API via
# UniversalProxy.Bluez.Client) the relevant duty cycle is the AdvMonitor scan
# window/interval. BlueZ's defaults are aggressive (~50% duty), which
# fire-hoses BLE advertisements: every received advert becomes an org.bluez
# PropertiesChanged signal the rebus client must D-Bus-decode, dominating BEAM
# CPU. A ~10% duty cycle (30ms window every 300ms) cuts the advert rate ~5x
# with no practical loss for passive sensor scanning — the same window/interval
# the previous blue_heron stack used on this hardware.
#
# NOTE: bluetoothd 5.79 logs "Unknown key ScanIntervalAdvMonitor for group LE"
# (likewise ScanWindow...) at startup. That warning is COSMETIC — an upstream
# bug: 5.79's src/main.c key-validation whitelist (le_options[]) misspells
# these as ScanIntervalAdvMonitoring/ScanWindowAdvMonitoring, while the actual
# parser (parse_le_config()) reads the names below, which match 5.79's own
# shipped main.conf documentation. check_config() only warns and never blocks
# parsing, so the values ARE applied. Upstream master fixed the whitelist to
# the non-"ing" names — i.e. these keys stay correct on future BlueZ bumps.
#
# When HA switches the scanner to active mode (Adapter1.StartDiscovery), the
# duty cycle is ScanIntervalDiscovery/ScanWindowDiscovery instead; we tune it
# to the same ~10% for the same firehose reason. Active mode's purpose here is
# SCAN_RSP collection (scan requests answered by peripherals), not a wider
# listening window.
#
# Units are raw BLE scan units of 0.625ms (Bluetooth Core Spec): 48 * 0.625 =
# 30ms window, 480 * 0.625 = 300ms interval. All other settings fall back to
# bluetoothd defaults.
[LE]
ScanIntervalAdvMonitor = 480
ScanWindowAdvMonitor = 48
ScanIntervalDiscovery = 480
ScanWindowDiscovery = 48
