[tools]
erlang = "29.1.1"
elixir = "1.20.3-otp-29"

[env]
MIX_TARGET = "rpi3"

[tasks.test]
description = "Run tests with MIX_TARGET=host"
run = "MIX_TARGET=host mix test"

[tasks.test-circuits-cec]
description = "Run the in-repo circuits_cec library's own tests (CI runs them too)"
dir = "deps_local/circuits_cec"
run = "MIX_TARGET=host mix deps.get && MIX_TARGET=host mix test"

[tasks.firmware]
description = "Build firmware for a target: mise run firmware -- rpi3"
# Clean ALL per-target native binaries first: a foreign-arch binary left in
# priv/ ships into the release and the Nerves rootfs scrubber rejects it.
# Emerge's precompiled NIFs share deps/emerge/priv/native across targets;
# dropping it with this target's compiled emerge makes the build restore
# only this target's NIF (from the rustler_precompiled cache).
run = 'T="{{arg(name="target")}}" && rm -rf priv/sendspin_player priv/milkdrop_renderer deps/emerge/priv/native "_build/${T}_${MIX_ENV:-dev}/lib/emerge" && MIX_TARGET="$T" mix firmware'

[tasks.mix-for]
description = "Run a mix task for a target: mise run mix-for -- rpi0 deps.get"
run = 'MIX_TARGET="{{arg(name="target")}}" mix "{{arg(name="task")}}"'
