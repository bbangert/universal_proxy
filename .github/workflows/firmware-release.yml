name: Build Firmware Releases

on:
  release:
    types: [created]

permissions:
  contents: write

env:
  MIX_ENV: prod
  ELIXIR_VERSION: "1.20.2-otp-29"
  OTP_VERSION: "29.0.3"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - bbb
          - mangopi_mq_pro
          - qemu_aarch64
          - rpi
          - rpi0
          - rpi0_2
          - rpi2
          - rpi3
          - rpi4
          - rpi5
          - x86_64

    env:
      MIX_TARGET: ${{ matrix.target }}
      # The 8 custom-forked targets (rpi*, x86_64) pull prebuilt Nerves system
      # artifacts from the public bbangert/nerves_systems_universal_proxy
      # releases via the `:github_releases` resolver, which calls the GitHub
      # API. Unauthenticated, that API is rate-limited (60/hr per IP) and the
      # shared runner IP gets blocked, so the download silently fails and Mix
      # falls through to "Nerves packages need to be built" — there is no local
      # Buildroot, so the job dies. A token lifts the limit to 5000/hr; the
      # repo-scoped default works since the releases repo is public.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential automake autoconf \
            pkg-config libssl-dev libncurses5-dev libmnl-dev \
            squashfs-tools protobuf-compiler libarchive-dev

      - name: Install fwup
        run: |
          FWUP_VERSION="1.15.0"
          curl -fsSL "https://github.com/fwup-home/fwup/releases/download/v${FWUP_VERSION}/fwup_${FWUP_VERSION}_amd64.deb" -o /tmp/fwup.deb
          sudo dpkg -i /tmp/fwup.deb

      - name: Generate SSH key for Nerves config
        run: ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install Nerves bootstrap
        run: mix archive.install hex nerves_bootstrap --force

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/${{ matrix.target }}_prod
          key: ${{ runner.os }}-${{ matrix.target }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-mix-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Build assets
        run: |
          mix assets.setup
          mix assets.deploy

      - name: Build firmware
        run: mix firmware

      - name: Rename firmware artifact
        run: |
          cp _build/${MIX_TARGET}_prod/nerves/images/universal_proxy.fw \
             universal_proxy_${MIX_TARGET}.fw

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: universal_proxy_${{ matrix.target }}.fw

  # Builds and signs release-manifest.json per docs/manifest-format.md.
  # The signature scheme is signer-agnostic (raw Ed25519 over the
  # manifest's sha512 digest); FW_SIGNING_BACKEND selects who signs:
  #
  #   aws-kms (default) — needs repo vars AWS_ROLE_ARN, AWS_REGION,
  #     KMS_SIGNING_KEY_ID (Ed25519 key, OIDC role with kms:Sign)
  #   gcp-kms — needs GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT,
  #     GCP_KMS_LOCATION, GCP_KMS_KEYRING, GCP_KMS_KEY, GCP_KMS_KEY_VERSION
  #     (EC_SIGN_ED25519 key)
  #   local-key — signs in-CI with an Ed25519 PEM private key supplied
  #     as the FW_SIGNING_KEY_PEM_B64 secret (base64 of the PEM). No
  #     cloud KMS; lower security than KMS (the key exists in the runner)
  #     — intended for test/pre-KMS releases. Generate with:
  #       openssl genpkey -algorithm ed25519 -out fw_signing.pem
  #       openssl pkey -in fw_signing.pem -pubout -outform DER | tail -c 32 \
  #         > rootfs_overlay/etc/firmware_signing.pub   # commit this
  #       base64 -w0 fw_signing.pem                      # store as the secret
  #   manual — no cloud creds; uploads the unsigned manifest and prints
  #     instructions for signing offline (workstation HSM / openssl) and
  #     attaching release-manifest.sig by hand
  #
  # The job fails until the chosen backend's variables/secrets exist.
  sign_manifest:
    name: Sign release manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    env:
      FW_SIGNING_BACKEND: ${{ vars.FW_SIGNING_BACKEND || 'aws-kms' }}

    steps:
      - name: Download firmware assets
        env:
          # Bind release/repo context to env vars rather than interpolating
          # ${{ github.* }} into the shell: a tag_name containing shell
          # metacharacters (git ref names permit `` $ ( ) ; | ``) would
          # otherwise execute inside this KMS-privileged job.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p fw
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'universal_proxy_*.fw' \
            --dir fw

      - name: Generate release manifest
        run: |
          signed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          counter="$(date +%s)"
          targets="{}"
          for f in fw/universal_proxy_*.fw; do
            name="$(basename "$f")"
            target="${name#universal_proxy_}"
            target="${target%.fw}"
            sha256="$(sha256sum "$f" | cut -d' ' -f1)"
            size="$(stat -c%s "$f")"
            entry="$(jq -n --arg asset "$name" --arg sha256 "$sha256" --argjson size "$size" \
              '{asset: $asset, sha256: $sha256, size: $size}')"
            targets="$(jq --argjson entry "$entry" --arg target "$target" \
              '. + {($target): $entry}' <<<"$targets")"
          done
          jq -n \
            --argjson version 1 \
            --argjson counter "$counter" \
            --arg signed_at "$signed_at" \
            --argjson targets "$targets" \
            '{version: $version, counter: $counter, signed_at: $signed_at,
              expires_at: null, targets: $targets, deltas: {}}' \
            > release-manifest.json

      - name: Compute manifest digest
        run: |
          # The signed message is always sha512(manifest_bytes), never the
          # manifest itself — keeps the message a constant 64 bytes (inside
          # AWS KMS's 4096-byte RAW cap, trivial for any HSM). See
          # docs/manifest-format.md "Signature construction".
          sha512sum release-manifest.json | cut -d' ' -f1 | xxd -r -p > digest.bin

      - name: Configure AWS credentials
        if: env.FW_SIGNING_BACKEND == 'aws-kms'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign manifest (AWS KMS)
        if: env.FW_SIGNING_BACKEND == 'aws-kms'
        run: |
          aws kms sign --key-id "${{ vars.KMS_SIGNING_KEY_ID }}" \
            --message fileb://digest.bin --message-type RAW \
            --signing-algorithm ED25519_SHA_512 \
            --output text --query Signature | base64 -d > release-manifest.sig

      - name: Authenticate to Google Cloud
        if: env.FW_SIGNING_BACKEND == 'gcp-kms'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Sign manifest (GCP KMS)
        if: env.FW_SIGNING_BACKEND == 'gcp-kms'
        run: |
          # EC_SIGN_ED25519 is PureEdDSA over raw input: pass the digest as
          # the input file and omit --digest-algorithm. gcloud writes the
          # signature base64-encoded.
          gcloud kms asymmetric-sign \
            --location "${{ vars.GCP_KMS_LOCATION }}" \
            --keyring "${{ vars.GCP_KMS_KEYRING }}" \
            --key "${{ vars.GCP_KMS_KEY }}" \
            --version "${{ vars.GCP_KMS_KEY_VERSION }}" \
            --input-file digest.bin \
            --signature-file release-manifest.sig.b64
          base64 -d release-manifest.sig.b64 > release-manifest.sig

      - name: Sign manifest (local key)
        if: env.FW_SIGNING_BACKEND == 'local-key'
        env:
          FW_SIGNING_KEY_PEM_B64: ${{ secrets.FW_SIGNING_KEY_PEM_B64 }}
        run: |
          # Ed25519 in openssl is PureEdDSA: -rawin signs digest.bin as
          # the message, matching the device's verify construction.
          test -n "$FW_SIGNING_KEY_PEM_B64" || { echo "FW_SIGNING_KEY_PEM_B64 secret is not set"; exit 1; }
          umask 077
          # Remove the key on ANY exit — `set -e` would otherwise skip a
          # trailing rm if openssl fails, leaving the PEM on the runner.
          trap 'rm -f signing_key.pem' EXIT
          printf '%s' "$FW_SIGNING_KEY_PEM_B64" | base64 -d > signing_key.pem
          openssl pkeyutl -sign -rawin -inkey signing_key.pem \
            -in digest.bin -out release-manifest.sig

      - name: Assert raw Ed25519 signature
        if: env.FW_SIGNING_BACKEND != 'manual'
        run: test "$(stat -c%s release-manifest.sig)" = 64

      - name: Upload manifest and signature to release
        if: env.FW_SIGNING_BACKEND != 'manual'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release-manifest.json
            release-manifest.sig

      - name: Upload unsigned manifest (manual signing)
        if: env.FW_SIGNING_BACKEND == 'manual'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-manifest.json

      - name: Print manual signing instructions
        if: env.FW_SIGNING_BACKEND == 'manual'
        # TAG via env, not ${{ }} interpolation — see the download step.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "Manifest uploaded UNSIGNED. Sign it offline (see"
          echo "docs/manifest-format.md) and attach the signature:"
          echo
          echo "  gh release download $TAG -p release-manifest.json"
          echo "  sha512sum release-manifest.json | cut -d' ' -f1 | xxd -r -p > digest.bin"
          echo "  # sign digest.bin with your HSM/key -> release-manifest.sig (raw 64 bytes)"
          echo "  gh release upload $TAG release-manifest.sig"
          echo
          echo "Devices with verification_required=true will refuse this"
          echo "release until release-manifest.sig is attached."
