name: Build Firmware Releases

on:
  release:
    types: [created]

permissions:
  contents: write

env:
  MIX_ENV: prod
  ELIXIR_VERSION: "1.20.3-otp-29"
  OTP_VERSION: "29.0.5"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - bbb
          - mangopi_mq_pro
          - qemu_aarch64
          - rpi
          - rpi0
          - rpi0_2
          - rpi2
          - rpi3
          - rpi4
          - rpi5
          - x86_64

    env:
      MIX_TARGET: ${{ matrix.target }}
      # The 8 custom-forked targets (rpi*, x86_64) pull prebuilt Nerves system
      # artifacts from the public bbangert/nerves_systems_universal_proxy
      # releases via the `:github_releases` resolver, which calls the GitHub
      # API. Unauthenticated, that API is rate-limited (60/hr per IP) and the
      # shared runner IP gets blocked, so the download silently fails and Mix
      # falls through to "Nerves packages need to be built" — there is no local
      # Buildroot, so the job dies. A token lifts the limit to 5000/hr; the
      # repo-scoped default works since the releases repo is public.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential automake autoconf \
            pkg-config libssl-dev libncurses5-dev libmnl-dev \
            squashfs-tools protobuf-compiler libarchive-dev

      - name: Install fwup
        run: |
          FWUP_VERSION="1.15.0"
          curl -fsSL "https://github.com/fwup-home/fwup/releases/download/v${FWUP_VERSION}/fwup_${FWUP_VERSION}_amd64.deb" -o /tmp/fwup.deb
          sudo dpkg -i /tmp/fwup.deb

      - name: Generate SSH key for Nerves config
        run: ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install Nerves bootstrap
        run: mix archive.install hex nerves_bootstrap --force

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/${{ matrix.target }}_prod
          key: ${{ runner.os }}-${{ matrix.target }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-mix-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Build assets
        run: |
          mix assets.setup
          mix assets.deploy

      - name: Build firmware
        run: mix firmware

      - name: Rename firmware artifact
        run: |
          cp _build/${MIX_TARGET}_prod/nerves/images/universal_proxy.fw \
             universal_proxy_${MIX_TARGET}.fw

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: universal_proxy_${{ matrix.target }}.fw

  # Sign the release manifest via the reusable workflow published by the
  # extracted nerves_github_updater library (bbangert/nerves_github_updater,
  # pinned to the hex-released tag). Signer-agnostic: raw Ed25519 over
  # sha512(manifest). The FW_SIGNING_BACKEND repo variable selects the
  # backend (aws-kms default | gcp-kms | local-key | manual); each needs its
  # own vars/secrets — see the reusable workflow's inputs. Note aws-role-arn
  # is now a SECRET (was the AWS_ROLE_ARN repo var in the old inline job).
  # target-strip-prefix maps `universal_proxy_<target>.fw` asset names to the
  # bare target key the device's target_fn returns (e.g. "rpi3").
  sign_manifest:
    name: Sign release manifest
    needs: build
    permissions:
      id-token: write
      contents: write
    uses: bbangert/nerves_github_updater/.github/workflows/sign-firmware.yml@0.2.0
    with:
      tag: ${{ github.event.release.tag_name }}
      asset-glob: universal_proxy_*.fw
      target-strip-prefix: universal_proxy_
      signing-backend: ${{ vars.FW_SIGNING_BACKEND || 'aws-kms' }}
      aws-region: ${{ vars.AWS_REGION }}
      kms-key-id: ${{ vars.KMS_SIGNING_KEY_ID }}
      gcp-kms-location: ${{ vars.GCP_KMS_LOCATION }}
      gcp-kms-keyring: ${{ vars.GCP_KMS_KEYRING }}
      gcp-kms-key: ${{ vars.GCP_KMS_KEY }}
      gcp-kms-key-version: ${{ vars.GCP_KMS_KEY_VERSION }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
      gcp-workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      gcp-service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      fw-signing-key-pem-b64: ${{ secrets.FW_SIGNING_KEY_PEM_B64 }}
