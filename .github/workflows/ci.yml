name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_TARGET: host
  ELIXIR_VERSION: "1.20.3-otp-29"
  OTP_VERSION: "29.0.5"
  # System packages required to compile NIFs that mix deps.get pulls in
  # (libmnl-dev for vintage_net, libssl-dev for crypto-using NIFs).
  # libasound2-dev is needed by the sendspin_player Mix compiler, which
  # builds c_src/sendspin_player/ as part of `mix compile`.
  APT_PACKAGES: build-essential automake autoconf pkg-config libssl-dev libmnl-dev libasound2-dev

jobs:
  compile-format:
    name: Compile · Format
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix archive.install hex nerves_bootstrap --force
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/host_dev
          key: ${{ runner.os }}-host-dev-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-host-dev-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted

  sobelow:
    name: Sobelow
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix archive.install hex nerves_bootstrap --force
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/host_dev
          key: ${{ runner.os }}-host-dev-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-host-dev-
      - run: mix deps.get
      # --private skips Sobelow's external update-check request.
      # Config.HTTPS ignored deliberately: this is a LAN-only Nerves device
      # serving plain http on port 80 with no TLS terminator (no certificate
      # it could present for universal_proxy.local / a bare IP); force_ssl
      # would redirect the web UI to a listener that doesn't exist.
      - run: mix sobelow --private --skip --exit --threshold medium --ignore Config.HTTPS

  credo:
    name: Credo
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix archive.install hex nerves_bootstrap --force
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/host_dev
          key: ${{ runner.os }}-host-dev-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-host-dev-
      - run: mix deps.get
      - run: mix credo --strict

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix archive.install hex nerves_bootstrap --force
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/host_test
          key: ${{ runner.os }}-host-test-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-host-test-
      - run: mix deps.get
      - run: mix test --warnings-as-errors

  # The in-repo circuits_cec library (deps_local/circuits_cec) is its own Mix
  # project: the app only compiles it as a dependency, so its tests, format
  # and dialyzer run here. Its test env also builds the stubbed-ioctl helper
  # that the host tests drive.
  circuits-cec:
    name: circuits_cec
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: deps_local/circuits_cec
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            deps_local/circuits_cec/deps
            deps_local/circuits_cec/_build
          key: ${{ runner.os }}-circuits-cec-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('deps_local/circuits_cec/mix.lock') }}
          restore-keys: ${{ runner.os }}-circuits-cec-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-
      - run: mix deps.get
      - run: mix format --check-formatted
      # The golden structs must still be what the vendored header lays out.
      - run: cc -std=c11 -Wall -I c_src -o "$RUNNER_TEMP/gen_golden" test/fixtures/gen_golden.c
      - run: '"$RUNNER_TEMP/gen_golden" | diff -u test/fixtures/golden.txt -'
      - run: mix compile --warnings-as-errors
      - run: mix test --warnings-as-errors
      - run: MIX_ENV=dev mix dialyzer --format github

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix archive.install hex nerves_bootstrap --force
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/host_dev
          key: ${{ runner.os }}-host-dev-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-host-dev-
      - uses: actions/cache@v6
        with:
          path: priv/plts
          # Include the vendored path-dep sources (deps_local, e.g. the
          # mdns_lite fork) in the key: a path dep doesn't change mix.lock when it
          # changes, and dialyxir won't refresh a restored PLT for a same-version
          # path dep — a stale PLT then reports its new exports as a "missing
          # function". Hash .ex plus mix.exs (dep list / compiler opts) and
          # .erl/.hrl so a behavior/type change in any vendored source busts it.
          # The same hash is in the restore-keys prefix so a vendored-dep change
          # can't fall back to a stale PLT (forces a fresh build); a mix.lock-only
          # change still reuses the PLT.
          key: ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('deps_local/**/*.ex', 'deps_local/**/mix.exs', 'deps_local/**/*.erl', 'deps_local/**/*.hrl') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('deps_local/**/*.ex', 'deps_local/**/mix.exs', 'deps_local/**/*.erl', 'deps_local/**/*.hrl') }}-
      - run: mix deps.get
      - run: mix dialyzer --format github

  argus:
    name: Argus
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix archive.install hex nerves_bootstrap --force
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/host_dev
          # Separate key from the ubuntu-latest jobs: this job pins its image,
          # so its compiled NIFs/sendspin_player binary must not be shared if
          # ubuntu-latest moves.
          key: ${{ runner.os }}-2404-argus-host-dev-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-2404-argus-host-dev-
      - run: mix deps.get
      # Compile first so build output never mixes into the JSON report.
      - run: mix compile
      # No file-level ignores: every finding must be fixed or carry a
      # reviewed entry in .argus-baseline.exs (see scripts/argus_baseline.exs).
      - run: mix argus --format json > argus.json
      - run: elixir scripts/argus_baseline.exs --self-test
      - run: elixir scripts/argus_baseline.exs argus.json .argus-baseline.exs

  hex-audit:
    name: Hex audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix archive.install hex nerves_bootstrap --force
      - uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-host-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-host-deps-
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix deps.unlock --check-unused
